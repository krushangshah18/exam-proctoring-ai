# /etc/nginx/sites-available/proctorapi
# Symlink: sudo ln -s /etc/nginx/sites-available/proctorapi /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;                  # Certbot will replace this with your sslip.io hostname

    # Required for certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP → HTTPS (certbot adds this block automatically)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;                  # Certbot replaces with your hostname

    # SSL — certbot fills these in automatically
    # ssl_certificate     /etc/letsencrypt/live/<hostname>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<hostname>/privkey.pem;

    # Security headers
    add_header X-Frame-Options          "DENY"              always;
    add_header X-Content-Type-Options   "nosniff"           always;
    add_header Referrer-Policy          "strict-origin"     always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gzip (skip for SSE streams — handled per-location below)
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;

    # Max upload size (selfie + exam evidence frames)
    client_max_body_size 20M;

    # ── Standard API routes ──────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout   10s;
        proxy_send_timeout      60s;
        proxy_read_timeout      60s;
    }

    # ── SSE endpoints — disable buffering, extend timeouts ──────────────────
    # Matches /exam/events/* and /exam/*/stream
    location ~* ^/exam/(events|.*stream) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE requires no buffering
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;   # 1 hour — exam duration
        proxy_send_timeout 3600s;

        # Keep connection alive through load balancers / proxies
        proxy_set_header   Connection        '';
        chunked_transfer_encoding on;
    }
}
